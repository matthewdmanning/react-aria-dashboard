name: Generate lockfile

on:
  push:
    branches: [integration/issues-1-15]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove generator
        run: |
          rm .github/workflows/generate-lockfile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/generate-lockfile.yml
          git commit -m "Update npm lockfile"
          git push
