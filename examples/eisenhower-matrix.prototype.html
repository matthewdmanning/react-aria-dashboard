<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYPE — Eisenhower matrix</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 1rem;
      }
      .quadrant {
        border: 1px solid #888;
        border-radius: 8px;
        padding: 0.75rem;
        min-height: 8rem;
      }
      [role="gridcell"],
      [role="row"] {
        cursor: grab;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./eisenhower-matrix.prototype.main.tsx"></script>
  </body>
</html>
